[project]
name = "nca"
version = "0.1.0"
description = "Growing Neural Cellular Automata: training and preview rendering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "numpy>=2.1",
    "pillow>=11.0",
    "typer>=0.15",
    "tqdm>=4.67",
]

[project.scripts]
nca = "nca.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nca"]

# GPU (Blackwell / RTX 50xx) には CUDA 12.8 以降のホイールが必須。
# CPU 環境や macOS では PyPI の既定ホイールで動くよう index は明示指定にとどめる。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 実際に学習ループを回すテスト"]
